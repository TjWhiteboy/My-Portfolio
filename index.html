<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Scroll Animation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            /* Extra height to allow scrolling, controls the speed of scroll animation */
            height: 600vh;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }

        /* Hide scrollbars for a cleaner, full-screen end-to-end look */
        ::-webkit-scrollbar {
            display: none;
        }
        html {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE and Edge */
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-size: 24px;
            font-weight: 300;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Animation... 0%</div>
    <canvas id="scroll-canvas"></canvas>

    <script>
        const canvas = document.getElementById("scroll-canvas");
        const context = canvas.getContext("2d");
        const loadingEl = document.getElementById("loading");

        const frameCount = 300;
        const currentFrame = index => (
            `./ezgif-732f62894c500211-jpg/ezgif-frame-${index.toString().padStart(3, '0')}.jpg`
        );

        const images = [];
        let imagesLoaded = 0;

        // Preload images
        function preloadImages() {
            for (let i = 1; i <= frameCount; i++) {
                const img = new Image();
                img.onload = () => {
                    imagesLoaded++;
                    loadingEl.textContent = `Loading Animation... ${Math.round((imagesLoaded / frameCount) * 100)}%`;
                    if (imagesLoaded === frameCount) {
                        setTimeout(() => {
                            loadingEl.style.opacity = 0;
                            setTimeout(() => {
                                loadingEl.style.display = 'none';
                            }, 500);
                        }, 200);
                        initAnimation();
                    }
                };
                img.onerror = () => {
                    // Try fallback if there is any issue loading
                    imagesLoaded++;
                    if (imagesLoaded === frameCount) {
                        initAnimation();
                    }
                };
                img.src = currentFrame(i);
                images.push(img);
            }
        }

        // Animation State
        const state = {
            frameIndex: 0,
            scrollProgress: 0,
            smoothedProgress: 0
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            renderFrame();
        }

        function renderFrame() {
            const imgIndex = Math.min(
                frameCount - 1,
                Math.max(0, Math.floor(state.smoothedProgress * frameCount))
            );
            const img = images[imgIndex];
            if (!img || !img.complete || img.naturalWidth === 0) return;

            // Clear canvas
            context.clearRect(0, 0, canvas.width, canvas.height);

            // Keep end-to-end visual (similar to object-fit: cover) without zooming
            const canvasRatio = canvas.width / canvas.height;
            const imgRatio = img.naturalWidth / img.naturalHeight;

            let drawWidth, drawHeight, drawX, drawY;

            if (canvasRatio > imgRatio) {
                // Canvas is wider than image
                drawWidth = canvas.width;
                drawHeight = canvas.width / imgRatio;
                drawX = 0;
                drawY = (canvas.height - drawHeight) / 2;
            } else {
                // Canvas is taller than image
                drawWidth = canvas.height * imgRatio;
                drawHeight = canvas.height;
                drawX = (canvas.width - drawWidth) / 2;
                drawY = 0;
            }

            context.drawImage(img, drawX, drawY, drawWidth, drawHeight);
        }

        function updateProgress() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            state.scrollProgress = maxScroll <= 0 ? 0 : scrollTop / maxScroll;
        }

        function tick() {
            // Lerp scroll position for ultra smooth transition
            // Increase 0.08 to make it faster, decrease to make it smoother and slower
            const lerpFactor = 0.08; 
            state.smoothedProgress += (state.scrollProgress - state.smoothedProgress) * lerpFactor;

            // Render current frame
            renderFrame();

            requestAnimationFrame(tick);
        }

        function initAnimation() {
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('scroll', updateProgress);
            
            // Set initial state
            updateProgress();
            state.smoothedProgress = state.scrollProgress;
            
            // Start rendering loop
            requestAnimationFrame(tick);
        }

        // Start preloading
        preloadImages();
    </script>
</body>
</html>
